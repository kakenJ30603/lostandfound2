<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    
    <meta http-equiv="refresh" content="900">

    <title>生徒用画面</title>

    <style>

        body{

            margin: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
        }

        h1{

            text-align: center;
            padding: 20px;
        }

        .container{

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;

            padding: 20px;
        }

        .card{

            background-color: white;

            border-radius: 10px;

            padding: 15px;

            box-shadow: 0 0 5px gray;
        }

        img{

            width: 100%;

            border-radius: 10px;
        }

        p{

            font-size: 18px;
        }

    </style>

</head>

<body>

    <h1>落とし物一覧</h1>

    <div class="container">

    {% for data in data_list %}

        <div class="card">

            <img src="/static2/images/{{ data.image }}">

            <p>登録番号：{{ data.number }}</p>

            <p>発見場所：{{ data.place }}</p>

            <p>詳細場所：{{ data.detail }}</p>

            <p>年月日：{{ data.date }}</p>

            <p>時刻：{{ data.time }}</p>

        </div>

    {% endfor %}

    </div>

</body>

</html>
