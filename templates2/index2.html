

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>落とし物登録</title>

<style>
:root {
    --blue: #55b6df;
    --blue-dark: #258bb8;
    --sky: #e4f6ff;
    --pale: #f5fbff;
    --ink: #23445b;
    --muted: #7895a8;
    --line: #d8edf7;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px 45px;
    min-height: 100vh;
    font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
    color: var(--ink);
    background:
        radial-gradient(circle at top left, #d8f4ff, transparent 35%),
        radial-gradient(circle at bottom right, #e6f7ff, transparent 30%),
        var(--pale);
}

.container {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    display: inline-flex;
    width: 65px;
    height: 65px;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    border-radius: 22px;
    background: linear-gradient(135deg, #91e0fa, #4baedb);
    color: white;
    font-size: 32px;
    box-shadow: 0 8px 20px #55b6df40;
}

h1 {
    margin: 0;
    font-size: clamp(26px, 5vw, 34px);
    letter-spacing: 0.05em;
}

.subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
}

.card {
    padding: clamp(22px, 5vw, 38px);
    background: white;
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: 0 12px 35px #318bb31f;
}

h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 25px;
    font-size: 19px;
}

h2::before {
    content: "";
    width: 5px;
    height: 23px;
    border-radius: 5px;
    background: var(--blue);
}

.field {
    margin-bottom: 22px;
}

label {
    display: block;
    margin-bottom: 9px;
    font-size: 14px;
    font-weight: 700;
}

.required {
    display: inline-block;
    margin-left: 7px;
    padding: 2px 7px;
    border-radius: 6px;
    color: var(--blue-dark);
    background: var(--sky);
    font-size: 10px;
}

input,
select {
    width: 100%;
    min-height: 49px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    outline: none;
    background: #fbfdff;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    transition: 0.2s;
}

input:focus,
select:focus {
    border-color: var(--blue);
    background: white;
    box-shadow: 0 0 0 4px #55b6df24;
}

.time-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.photo-box {
    padding: 22px 15px;
    border: 1px dashed #a7dff3;
    border-radius: 16px;
    background: #f4fbff;
    text-align: center;
}

.photo-icon {
    margin-bottom: 8px;
    font-size: 30px;
}

.photo-title {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
}

.photo-help {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.8;
}

#camera,
#canvas {
    display: none;
}

button {
    font: inherit;
}

.submit-button {
    width: 100%;
    min-height: 55px;
    margin-top: 8px;
    border: 0;
    border-radius: 15px;
    background: linear-gradient(135deg, #70cbed, #39a6d7);
    color: white;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    box-shadow: 0 8px 18px #39a6d73d;
    transition: 0.2s;
}

.submit-button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 22px #39a6d74d;
}

.submit-button:disabled {
    opacity: 0.6;
    cursor: wait;
}

#status {
    display: none;
    margin: 18px 0 0;
    padding: 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.8;
    text-align: center;
    overflow-wrap: anywhere;
}

#status.show {
    display: block;
}

#status.success {
    background: #e9f9f0;
    color: #24784a;
    border: 1px solid #c5ecd5;
}

#status.error {
    background: #fff0f0;
    color: #b43d3d;
    border: 1px solid #f3cccc;
}

#status.loading {
    background: #eef9ff;
    color: #287fa7;
    border: 1px solid #ccecf9;
}

.footer {
    margin-top: 22px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
}

@media (max-width: 480px) {
    body {
        padding: 22px 12px 32px;
    }

    .card {
        border-radius: 20px;
    }
}
</style>
</head>

<body>
<main class="container">

    <header>
        <div class="logo" aria-hidden="true">☁</div>
        <h1>落とし物登録</h1>
        <p class="subtitle">
            見つけた落とし物を登録して、<br>
            持ち主が見つけられるようにしましょう。
        </p>
    </header>

    <section class="card">
        <h2>落とし物の情報</h2>

        <form id="registerForm" action="/register" method="post">

            <div class="field">
                <label for="place">
                    発見場所<span class="required">必須</span>
                </label>
                <select id="place" name="place" required>
                    <option value="">場所を選択してください</option>
                    <option value="体育館">体育館</option>
                    <option value="実習棟">実習棟</option>
                    <option value="教室棟">教室棟</option>
                    <option value="管理棟">管理棟</option>
                    <option value="外">外</option>
                </select>
            </div>

            <div class="field">
                <label for="detail">
                    詳細場所<span class="required">必須</span>
                </label>
                <select id="detail" name="detail" required>
                    <option value="">先に発見場所を選択してください</option>
                </select>
            </div>

            <div class="field">
                <label for="date">
                    発見した日付<span class="required">必須</span>
                </label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="field">
                <label>発見した時刻<span class="required">必須</span></label>
                <div class="time-grid">
                    <select id="hour" name="hour" required>
                        <option value="">時を選択</option>
                    </select>
                    <select id="minute" name="minute" required>
                        <option value="">分を選択</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>落とし物の写真</label>
                <div class="photo-box">
                    <div class="photo-icon" aria-hidden="true">📷</div>
                    <p class="photo-title">カメラで写真を撮影します</p>
                    <p class="photo-help">
                        「登録する」を押すとカメラが起動し、<br>
                        写真を保存してから登録します。
                    </p>
                </div>
                <p class="photo-help">
                    ※ カメラの使用許可が表示されたら「許可」を選んでください。
                </p>
            </div>

            <input type="hidden" name="image_url" id="image_url">
            <video id="camera" autoplay playsinline></video>
            <canvas id="canvas"></canvas>

            <button type="submit" class="submit-button" id="submitButton">
                登録する
            </button>

            <p id="status" role="status" aria-live="polite"></p>
        </form>
    </section>

    <p class="footer">
        落とし物を見つけた人と、持ち主をつなぐシステム
    </p>
</main>

<script>
"use strict";

const form = document.getElementById("registerForm");
const placeSelect = document.getElementById("place");
const detailSelect = document.getElementById("detail");
const dateInput = document.getElementById("date");
const hourSelect = document.getElementById("hour");
const minuteSelect = document.getElementById("minute");
const camera = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const imageUrlInput = document.getElementById("image_url");
const statusMessage = document.getElementById("status");
const submitButton = document.getElementById("submitButton");

const CLOUDINARY_URL =
    "https://api.cloudinary.com/v1_1/qgl8mr0t/image/upload";
const CLOUDINARY_UPLOAD_PRESET = "lostandfound2";

const detailOptions = {
    "体育館": [
        "フロア", "トイレ", "女子更衣室", "男子更衣室",
        "柔道場", "フェンシング場", "レスリング場"
    ],
    "実習棟": [
        "J科実習棟", "K科実習棟", "M科実習棟",
        "F科実習棟", "EC科実習棟"
    ],
    "教室棟": [
        "J1教室前", "J2教室前", "J3教室前",
        "M1教室前", "M2教室前", "M3教室前",
        "F1教室前", "F2教室前", "F3教室前",
        "EC1教室前", "EC2教室前", "EC3教室前",
        "K1教室前", "K2教室前", "K3教室前"
    ],
    "管理棟": [
        "3階職員室前", "2階職員室前",
        "音楽室", "視聴覚室", "理科室"
    ],
    "外": [
        "野球場", "ハンドボール場", "サッカーグラウンド",
        "陸上競技場", "駐車場", "駐輪場"
    ]
};

function changeDetail() {
    const options = detailOptions[placeSelect.value] || [];
    detailSelect.replaceChildren();

    const first = document.createElement("option");
    first.value = "";
    first.textContent = options.length
        ? "詳細場所を選択してください"
        : "先に発見場所を選択してください";
    detailSelect.appendChild(first);

    options.forEach(function (name) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        detailSelect.appendChild(option);
    });
}

function fillTimeOptions(select, max, suffix) {
    for (let i = 0; i <= max; i++) {
        const value = String(i).padStart(2, "0");
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value + suffix;
        select.appendChild(option);
    }
}

function setToday() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    dateInput.value = `${year}-${month}-${day}`;
}

function showStatus(message, type) {
    statusMessage.textContent = message;
    statusMessage.className = "show " + type;
}

async function takeAndUploadPhoto() {
    let stream;

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
        });

        camera.srcObject = stream;
        await camera.play();

        await new Promise(function (resolve, reject) {
            if (camera.videoWidth > 0 && camera.videoHeight > 0) {
                resolve();
                return;
            }

            camera.onloadedmetadata = resolve;
            camera.onerror = function () {
                reject(new Error("カメラの映像を取得できませんでした。"));
            };
        });

        if (!camera.videoWidth || !camera.videoHeight) {
            throw new Error("カメラの映像を取得できませんでした。");
        }

        canvas.width = camera.videoWidth;
        canvas.height = camera.videoHeight;

        const context = canvas.getContext("2d");
        context.drawImage(camera, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise(function (resolve, reject) {
            canvas.toBlob(function (result) {
                if (result) resolve(result);
                else reject(new Error("写真を作成できませんでした。"));
            }, "image/jpeg", 0.85);
        });

        const uploadData = new FormData();
        uploadData.append("file", blob, "lost-item.jpg");
        uploadData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

        const response = await fetch(CLOUDINARY_URL, {
            method: "POST",
            body: uploadData
        });

        const result = await response.json();

        if (!response.ok || !result.secure_url) {
            throw new Error(
                result.error?.message || "写真の保存に失敗しました。"
            );
        }

        imageUrlInput.value = result.secure_url;
    } finally {
        if (stream) {
            stream.getTracks().forEach(function (track) {
                track.stop();
            });
        }
        camera.srcObject = null;
    }
}

/*
 * 重要：
 * submitイベントの最初にpreventDefault()を実行する。
 * これにより、通常のフォーム送信で/registerの画面に
 * 移動してしまうことを防ぐ。
 */
form.addEventListener("submit", async function (event) {
    event.preventDefault();

    if (!form.reportValidity()) return;

    if (submitButton.disabled) return;

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
        showStatus(
            "カメラを利用できません。HTTPSで開いているか確認してください。",
            "error"
        );
        return;
    }

    submitButton.disabled = true;
    imageUrlInput.value = "";

    try {
        showStatus("📷 写真を撮影しています……", "loading");
        await takeAndUploadPhoto();

        showStatus("登録しています……", "loading");

        /*
         * fetchで送信するため、ページは移動しない。
         * app.pyがJSONを返す必要がある。
         */
        const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: {
                "Accept": "application/json"
            }
        });

        let result;

        try {
            result = await response.json();
        } catch {
            throw new Error(
                "サーバーの返事を読み取れません。app.pyの/registerを確認してください。"
            );
        }

        if (!response.ok || !result.success) {
            throw new Error(result.message || "登録に失敗しました。");
        }

        showStatus("🎉 登録ありがとうございます！", "success");

        form.reset();
        imageUrlInput.value = "";
        changeDetail();
        setToday();

    } catch (error) {
        console.error("登録エラー:", error);
        showStatus("登録できませんでした：" + error.message, "error");
    } finally {
        submitButton.disabled = false;
    }
});

placeSelect.addEventListener("change", changeDetail);

fillTimeOptions(hourSelect, 23, "時");
fillTimeOptions(minuteSelect, 59, "分");
changeDetail();
setToday();
</script>
</body>
</html>
