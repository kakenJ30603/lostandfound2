    <script>
        // 発見場所に応じて詳細場所を変更する
        function changeDetail() {
            const place = document.getElementById("place").value;
            const detail = document.getElementById("detail");

            const options = {
                "体育館": [
                    "フロア", "トイレ", "女子更衣室", "男子更衣室",
                    "柔道場", "フェンシング場", "レスリング場"
                ],
                "実習棟": [
                    "J科実習棟", "K科実習棟", "M科実習棟",
                    "F科実習棟", "EC科実習棟"
                ],
                "教室棟": [
                    "J1教室前", "J2教室前", "J3教室前",
                    "M1教室前", "M2教室前", "M3教室前",
                    "F1教室前", "F2教室前", "F3教室前",
                    "EC1教室前", "EC2教室前", "EC3教室前",
                    "K1教室前", "K2教室前", "K3教室前"
                ],
                "管理棟": [
                    "3階職員室前", "2階職員室前",
                    "音楽室", "視聴覚室", "理科室"
                ],
                "外": [
                    "野球場", "ハンドボール場", "サッカーグラウンド",
                    "陸上競技場", "駐車場", "駐輪場"
                ]
            };

            detail.innerHTML = "";

            for (const name of (options[place] || [])) {
                const option = document.createElement("option");
                option.value = name;
                option.textContent = name;
                detail.appendChild(option);
            }
        }

        // カメラで撮影し、Cloudinaryへアップロードする
        async function uploadToCloudinary() {
            const video = document.getElementById("camera");
            const canvas = document.getElementById("canvas");
            const status = document.getElementById("status");
            let stream;

            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("このページではカメラを使用できません。HTTPSのURLで開いてください。");
                }

                status.textContent = "カメラを起動しています……";

                stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                video.srcObject = stream;

                await new Promise((resolve, reject) => {
                    if (video.readyState >= 1 && video.videoWidth > 0) {
                        resolve();
                        return;
                    }

                    const timeout = setTimeout(() => {
                        reject(new Error("カメラの映像を取得できませんでした。"));
                    }, 10000);

                    video.onloadedmetadata = () => {
                        clearTimeout(timeout);
                        resolve();
                    };
                });

                await video.play();
                await new Promise(resolve => setTimeout(resolve, 800));

                if (!video.videoWidth || !video.videoHeight) {
                    throw new Error("カメラの映像が空です。");
                }

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const context = canvas.getContext("2d");
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob(result => {
                        if (result) {
                            resolve(result);
                        } else {
                            reject(new Error("写真を作成できませんでした。"));
                        }
                    }, "image/jpeg", 0.85);
                });

                status.textContent = "写真をアップロードしています……";

                const formData = new FormData();
                formData.append("file", blob, "lost.jpg");
                formData.append("upload_preset", "lostandfound2");

                const response = await fetch(
                    "https://api.cloudinary.com/v1_1/qgl8mr0t/image/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.secure_url) {
                    throw new Error(
                        result.error?.message || "Cloudinaryへのアップロードに失敗しました。"
                    );
                }

                document.getElementById("image_url").value = result.secure_url;
                status.textContent = "写真の保存が完了しました。";

            } finally {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                video.srcObject = null;
            }
        }

        // 確定ボタンを押したときの処理
        document.getElementById("registerForm").addEventListener(
            "submit",
            async function(event) {
                event.preventDefault();

                const form = event.currentTarget;
                const button = document.getElementById("submitButton");
                const status = document.getElementById("status");

                document.getElementById("dateError").textContent = "";
                document.getElementById("timeError").textContent = "";

                if (!form.elements.date.value) {
                    document.getElementById("dateError").textContent =
                        "※年月日を入力してください";
                    return;
                }

                if (!form.elements.hour.value || !form.elements.minute.value) {
                    document.getElementById("timeError").textContent =
                        "※時刻を選択してください";
                    return;
                }

                button.disabled = true;

                try {
                    await uploadToCloudinary();

                    status.textContent = "登録しています……";
                    form.submit();

                } catch (error) {
                    console.error(error);

                    status.textContent =
                        "失敗しました：" + (error.message || "カメラの使用を許可してください。");

                    button.disabled = false;
                }
            }
        );

        // 最初の詳細場所を設定する
        changeDetail();
    </script>
