        <button type="submit">確定</button>

    </form>

<script>

function changeDetail(){

    let place = document.getElementById("place").value;

    let detail = document.getElementById("detail");

    detail.innerHTML = "";

    let options = [];

    if(place == "体育館"){

        options = [
            "フロア",
            "トイレ",
            "女子更衣室",
            "男子更衣室",
            "柔道場",
            "フェンシング場",
            "レスリング場"
        ];
    }

    else if(place == "実習棟"){

        options = [
            "J科実習棟",
            "K科実習棟",
            "M科実習棟",
            "F科実習棟",
            "EC科実習棟"
        ];
    }

    else if(place == "教室棟"){

        options = [
            "J1教室前",
            "J2教室前",
            "J3教室前",
            "M1教室前",
            "M2教室前",
            "M3教室前",
            "F1教室前",
            "F2教室前",
            "F3教室前",
            "EC1教室前",
            "EC2教室前",
            "EC3教室前",
            "K1教室前",
            "K2教室前",
            "K3教室前"
        ];
    }

    else if(place == "管理棟"){

        options = [
            "3階職員室前",
            "2階職員室前",
            "音楽室",
            "視聴覚室",
            "理科室"
        ];
    }

    else if(place == "外"){

    options = [
        "野球場",
        "ハンドボール場",
        "サッカーグラウンド",
        "陸上競技場",
        "駐車場",
        "駐輪場"
    ];
}

    for(let i = 0; i < options.length; i++){

        let option = document.createElement("option");

        option.text = options[i];
        option.value = options[i];

        detail.add(option);
    }
}

function checkForm(){

    let date = document.getElementsByName("date")[0].value;

    let hour = document.getElementsByName("hour")[0].value;

    let minute = document.getElementsByName("minute")[0].value;

    document.getElementById("dateError").innerHTML = "";

    document.getElementById("timeError").innerHTML = "";

    let ok = true;

    if(date == ""){

        document.getElementById("dateError").innerHTML =
        "※年月日を入力してください";

        ok = false;
    }

    if(hour == "" || minute == ""){

        document.getElementById("timeError").innerHTML =
        "※時刻を入力してください";

        ok = false;
    }

    return ok;
}

changeDetail();

</script>
