<script>


/* =========================
   詳細場所
========================= */

function changeDetail(){

    let place = document.getElementById("place").value;

    let detail = document.getElementById("detail");

    detail.innerHTML = "";

    let options = [];


    if(place == "体育館"){

        options = [
            "フロア",
            "トイレ",
            "女子更衣室",
            "男子更衣室",
            "柔道場",
            "フェンシング場",
            "レスリング場"
        ];

    }


    else if(place == "実習棟"){

        options = [
            "J科実習棟",
            "K科実習棟",
            "M科実習棟",
            "F科実習棟",
            "EC科実習棟"
        ];

    }


    else if(place == "教室棟"){

        options = [
            "J1教室前",
            "J2教室前",
            "J3教室前",
            "M1教室前",
            "M2教室前",
            "M3教室前",
            "F1教室前",
            "F2教室前",
            "F3教室前",
            "EC1教室前",
            "EC2教室前",
            "EC3教室前",
            "K1教室前",
            "K2教室前",
            "K3教室前"
        ];

    }


    else if(place == "管理棟"){

        options = [
            "3階職員室前",
            "2階職員室前",
            "音楽室",
            "視聴覚室",
            "理科室"
        ];

    }


    else if(place == "外"){

        options = [
            "野球場",
            "ハンドボール場",
            "サッカーグラウンド",
            "陸上競技場",
            "駐車場",
            "駐輪場"
        ];

    }


    for(let i = 0; i < options.length; i++){

        let option = document.createElement("option");

        option.text = options[i];

        option.value = options[i];

        detail.add(option);

    }

}


/* =========================
   Cloudinaryへ写真を送る
========================= */

async function uploadToCloudinary(){

    const video = document.getElementById("camera");

    const canvas = document.getElementById("canvas");

    const status = document.getElementById("status");


    status.innerText = "カメラを起動しています……";


    const stream = await navigator.mediaDevices.getUserMedia({
        video: true
    });


    video.srcObject = stream;


    await new Promise(resolve => {
        video.onloadedmetadata = resolve;
    });


    await new Promise(resolve => setTimeout(resolve, 1000));


    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;


    const context = canvas.getContext("2d");

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    stream.getTracks().forEach(track => track.stop());


    status.innerText = "写真をアップロードしています……";


    const blob = await new Promise(resolve => {
        canvas.toBlob(resolve, "image/jpeg");
    });


    const formData = new FormData();

    formData.append("file", blob, "lost.jpg");

    formData.append(
        "upload_preset",
        "lostandfound"
    );


    const response = await fetch(
        "https://api.cloudinary.com/v1_1/qgl8mr0t/image/upload",
        {
            method: "POST",
            body: formData
        }
    );


    if(!response.ok){

        throw new Error("Cloudinaryへのアップロードに失敗しました");

    }


    const result = await response.json();


    document.getElementById("image_url").value =
        result.secure_url;


    status.innerText = "写真の撮影・保存が完了しました。";

}


/* =========================
   登録
========================= */

document.getElementById("registerForm").addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        let date =
            document.getElementsByName("date")[0].value;

        let hour =
            document.getElementsByName("hour")[0].value;

        let minute =
            document.getElementsByName("minute")[0].value;


        document.getElementById("dateError").innerHTML = "";

        document.getElementById("timeError").innerHTML = "";


        let ok = true;


        if(date == ""){

            document.getElementById("dateError").innerHTML =
                "※年月日を入力してください";

            ok = false;

        }


        if(hour == "" || minute == ""){

            document.getElementById("timeError").innerHTML =
                "※時刻を入力してください";

            ok = false;

        }


        if(!ok){

            return;

        }


        const button =
            document.getElementById("submitButton");


        button.disabled = true;


        try{

            await uploadToCloudinary();


            document.getElementById("registerForm").submit();

        }

        catch(error){

            console.error(error);

            document.getElementById("status").innerText =
                "写真の撮影に失敗しました。カメラの使用を許可してください。";

            button.disabled = false;

        }

    }
);


/* 最初の詳細場所 */

changeDetail();
