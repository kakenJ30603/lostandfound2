<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>落とし物登録画面</title>

    <style>
        :root {
            --ink: #19324a;
            --blue: #397fa7;
            --sky: #bce8f8;
            --pale: #f4fbff;
            --line: #d8eaf3;
            --muted: #7c92a4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 48px 22px 70px;
            font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
            color: var(--ink);
            background: #f4f9fc;
            background-image:
                radial-gradient(ellipse at 10% 0%, rgba(171, 225, 246, .55), transparent 35%),
                radial-gradient(ellipse at 100% 85%, rgba(203, 232, 244, .55), transparent 32%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: 5px;
            z-index: 5;
            background: linear-gradient(90deg, #9ddff5, #4b9dc6, #234c6b);
        }

        h1 {
            max-width: 900px;
            margin: 0 auto;
            color: #173b57;
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 800;
            letter-spacing: .07em;
            line-height: 1.35;
        }

        h1::before {
            content: "LOST & FOUND  /  SCHOOL";
            display: block;
            margin-bottom: 14px;
            color: #5a9cbd;
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .25em;
        }

        h1::after {
            content: "見つけた落とし物の情報を登録します";
            display: block;
            margin-top: 12px;
            color: #8095a5;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: .04em;
        }

        form {
            position: relative;
            max-width: 900px;
            margin: 32px auto 0;
            padding: clamp(24px, 5vw, 48px);
            background: rgba(255, 255, 255, .94);
            border: 1px solid rgba(214, 232, 242, .95);
            border-radius: 22px;
            box-shadow: 0 22px 60px rgba(32, 79, 108, .09);
        }

        form::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 3px;
            border-radius: 22px 22px 0 0;
            background: linear-gradient(90deg, #a4e3f6, #4b9dc6, #193f5b);
        }

        h2 {
            margin: 30px 0 9px;
            color: #244d6a;
            font-size: 14px;
            font-weight: 750;
            letter-spacing: .06em;
        }

        h2:first-child {
            margin-top: 0;
        }

        h2::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 15px;
            margin: 0 10px -3px 0;
            border-radius: 5px;
            background: #69bfdc;
        }

        select,
        input:not([type="hidden"]),
        textarea {
            display: block;
            width: 100%;
            max-width: 100%;
            min-height: 50px;
            margin-top: 5px;
            padding: 13px 15px;
            border: 1px solid var(--line);
            border-radius: 11px;
            outline: none;
            background: #fbfdff;
            color: var(--ink);
            font: inherit;
            font-size: 15px;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        select {
            cursor: pointer;
        }

        select:hover,
        input:hover,
        textarea:hover {
            border-color: #a8d6e9;
        }

        select:focus,
        input:focus,
        textarea:focus {
            border-color: #68b8d8;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(104, 184, 216, .14);
        }

        .timebox {
            display: inline-block !important;
            width: 112px !important;
            max-width: 35%;
            text-align: center;
            font-weight: 650 !important;
        }

        .error {
            margin: 7px 0 0;
            color: #d44e66;
            font-size: 13px;
            font-weight: 600;
        }

        #camera,
        #canvas {
            display: none;
        }

        #status {
            min-height: 20px;
            margin: 20px 0 0;
            color: #367da2;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        button {
            display: block;
            width: 100%;
            min-height: 56px;
            margin-top: 14px;
            padding: 15px 22px;
            border: 0;
            border-radius: 12px;
            background: #244f6d;
            color: #fff;
            font: inherit;
            font-size: 16px;
            font-weight: 750;
            letter-spacing: .12em;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(36, 79, 109, .16);
            transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
        }

        button::after {
            content: "  →";
            font-family: Arial, sans-serif;
            font-size: 18px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #34799f;
            box-shadow: 0 12px 24px rgba(36, 79, 109, .22);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: .55;
            cursor: wait;
            box-shadow: none;
        }

        @media (min-width: 700px) {
            form {
                padding: 42px 56px 46px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 32px 14px 44px;
            }

            h1 {
                font-size: 28px;
            }

            form {
                margin-top: 24px;
                padding: 25px 19px 28px;
                border-radius: 17px;
            }

            .timebox {
                width: 42% !important;
                max-width: 42%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <h1>落とし物登録画面</h1>

    <form id="registerForm" action="/register" method="post">
        <h2>発見場所</h2>

        <select id="place" name="place" onchange="changeDetail()" required>
            <option value="体育館">体育館</option>
            <option value="実習棟">実習棟</option>
            <option value="教室棟">教室棟</option>
            <option value="管理棟">管理棟</option>
            <option value="外">外</option>
        </select>

        <h2>詳細場所</h2>
        <select id="detail" name="detail" required></select>

        <h2>年月日</h2>
        <input type="date" name="date" required>
        <p id="dateError" class="error"></p>

        <h2>見つけた時刻</h2>

            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>

        </select>

        ：

            <option value="00">00</option>
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
            <option value="07">07</option>
            <option value="08">08</option>
            <option value="09">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>

            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>

            <option value="59">59</option>
        </select>

        <p id="timeError" class="error"></p>

        <!-- Cloudinaryに保存した写真のURL -->
        <input type="hidden" name="image_url" id="image_url">

        <video id="camera" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <p id="status" role="status"></p>

        <button type="submit" id="submitButton">確定</button>
    </form>

    <script>
        // 発見場所に応じて詳細場所を変更する
        function changeDetail() {
            const place = document.getElementById("place").value;
            const detail = document.getElementById("detail");

            const options = {
                "体育館": [
                    "フロア", "トイレ", "女子更衣室", "男子更衣室",
                    "柔道場", "フェンシング場", "レスリング場"
                ],
                "実習棟": [
                    "J科実習棟", "K科実習棟", "M科実習棟",
                    "F科実習棟", "EC科実習棟"
                ],
                "教室棟": [
                    "J1教室前", "J2教室前", "J3教室前",
                    "M1教室前", "M2教室前", "M3教室前",
                    "F1教室前", "F2教室前", "F3教室前",
                    "EC1教室前", "EC2教室前", "EC3教室前",
                    "K1教室前", "K2教室前", "K3教室前"
                ],
                "管理棟": [
                    "3階職員室前", "2階職員室前",
                    "音楽室", "視聴覚室", "理科室"
                ],
                "外": [
                    "野球場", "ハンドボール場", "サッカーグラウンド",
                    "陸上競技場", "駐車場", "駐輪場"
                ]
            };

            detail.innerHTML = "";

            for (const name of (options[place] || [])) {
                const option = document.createElement("option");
                option.value = name;
                option.textContent = name;
                detail.appendChild(option);
            }
        }

        // カメラで撮影し、Cloudinaryへアップロードする
        async function uploadToCloudinary() {
            const video = document.getElementById("camera");
            const canvas = document.getElementById("canvas");
            const status = document.getElementById("status");
            let stream;

            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("このページではカメラを使用できません。HTTPSのURLで開いてください。");
                }

                status.textContent = "カメラを起動しています……";

                stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                video.srcObject = stream;

                await new Promise((resolve, reject) => {
                    if (video.readyState >= 1 && video.videoWidth > 0) {
                        resolve();
                        return;
                    }

                    const timeout = setTimeout(() => {
                        reject(new Error("カメラの映像を取得できませんでした。"));
                    }, 10000);

                    video.onloadedmetadata = () => {
                        clearTimeout(timeout);
                        resolve();
                    };
                });

                await video.play();
                await new Promise(resolve => setTimeout(resolve, 800));

                if (!video.videoWidth || !video.videoHeight) {
                    throw new Error("カメラの映像が空です。");
                }

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const context = canvas.getContext("2d");
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob(result => {
                        if (result) {
                            resolve(result);
                        } else {
                            reject(new Error("写真を作成できませんでした。"));
                        }
                    }, "image/jpeg", 0.85);
                });

                status.textContent = "写真をアップロードしています……";

                const formData = new FormData();
                formData.append("file", blob, "lost.jpg");
                formData.append("upload_preset", "lostandfound2");

                const response = await fetch(
                    "https://api.cloudinary.com/v1_1/qgl8mr0t/image/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.secure_url) {
                    throw new Error(
                        result.error?.message || "Cloudinaryへのアップロードに失敗しました。"
                    );
                }

                document.getElementById("image_url").value = result.secure_url;
                status.textContent = "写真の保存が完了しました。";

            } finally {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                video.srcObject = null;
            }
        }

        // 確定ボタンを押したときの処理
        document.getElementById("registerForm").addEventListener(
            "submit",
            async function(event) {
                event.preventDefault();

                const form = event.currentTarget;
                const button = document.getElementById("submitButton");
                const status = document.getElementById("status");

                document.getElementById("dateError").textContent = "";
                document.getElementById("timeError").textContent = "";

                if (!form.elements.date.value) {
                    document.getElementById("dateError").textContent =
                        "※年月日を入力してください";
                    return;
                }

                if (!form.elements.hour.value || !form.elements.minute.value) {
                    document.getElementById("timeError").textContent =
                        "※時刻を選択してください";
                    return;
                }

                button.disabled = true;

                try {
                    await uploadToCloudinary();

                    status.textContent = "登録しています……";
                    form.submit();

                } catch (error) {
                    console.error(error);

                    status.textContent =
                        "失敗しました：" + (error.message || "カメラの使用を許可してください。");

                    button.disabled = false;
                }
            }
        );

        // 最初の詳細場所を設定する
        changeDetail();
    </script>
</body>
</html>
