
<style>
    :root {
        --ink: #23445b;
        --blue: #55b6df;
        --sky: #dff5ff;
        --pale: #f4fbff;
        --line: #d8edf7;
        --muted: #7895a7;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 48px 22px 70px;
        font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
        color: var(--ink);
        background: linear-gradient(135deg, #f4fbff, #e6f7ff, #ffffff);
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: linear-gradient(90deg, #bceeff, #64c7eb, #398dbb);
        z-index: 10;
    }

    h1 {
        max-width: 900px;
        margin: 0 auto;
        color: #245879;
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 800;
        letter-spacing: .06em;
        text-align: center;
    }

    h1::before {
        content: "落とし物を見つけたら";
        display: block;
        margin-bottom: 12px;
        color: #69b9d9;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .15em;
    }

    h1::after {
        content: "見つけた落とし物の情報を登録します";
        display: block;
        margin-top: 12px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 400;
        letter-spacing: .03em;
    }

    form {
        position: relative;
        max-width: 760px;
        margin: 32px auto 0;
        padding: clamp(24px, 5vw, 48px);
        background: rgba(255, 255, 255, .96);
        border: 1px solid #dceff8;
        border-radius: 24px;
        box-shadow: 0 16px 45px rgba(63, 143, 179, .12);
    }

    form::before {
        content: "";
        position: absolute;
        top: 0;
        left: 10%;
        width: 80%;
        height: 4px;
        border-radius: 0 0 8px 8px;
        background: linear-gradient(90deg, #bceeff, #55b6df, #8dd9f2);
    }

    h2 {
        margin: 30px 0 10px;
        color: #326d8e;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: .04em;
    }

    h2:first-child {
        margin-top: 0;
    }

    h2::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 16px;
        margin: 0 10px -3px 0;
        border-radius: 5px;
        background: #70c9e8;
    }

    select,
    input:not([type="hidden"]),
    textarea {
        display: block;
        width: 100%;
        max-width: 100%;
        min-height: 50px;
        margin-top: 6px;
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: 12px;
        outline: none;
        background: #fafdff;
        color: var(--ink);
        font: inherit;
        font-size: 15px;
        transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    select {
        cursor: pointer;
    }

    select:hover,
    input:hover,
    textarea:hover {
        border-color: #9bd9f0;
    }

    select:focus,
    input:focus,
    textarea:focus {
        border-color: #62c1e4;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(98, 193, 228, .16);
    }

    .timebox {
        display: inline-block !important;
        width: 112px !important;
        max-width: 35%;
        text-align: center;
        font-weight: 650 !important;
    }

    .error {
        margin: 7px 0 0;
        color: #df6378;
        font-size: 13px;
        font-weight: 600;
    }

    #camera,
    #canvas {
        display: none;
    }

    #status {
        min-height: 20px;
        margin: 20px 0 0;
        color: #398ab0;
        font-size: 13px;
        line-height: 1.7;
        overflow-wrap: anywhere;
    }

    button {
        display: block;
        width: 100%;
        min-height: 56px;
        margin-top: 14px;
        padding: 15px 22px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(120deg, #65c5e8, #398fbd);
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 750;
        letter-spacing: .12em;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(57, 143, 189, .22);
        transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    button::after {
        content: "  →";
        font-family: Arial, sans-serif;
        font-size: 18px;
    }

    button:hover:not(:disabled) {
        transform: translateY(-2px);
        filter: brightness(1.04);
        box-shadow: 0 12px 25px rgba(57, 143, 189, .3);
    }

    button:active:not(:disabled) {
        transform: translateY(0);
    }

    button:disabled {
        opacity: .55;
        cursor: wait;
        box-shadow: none;
    }

    @media (min-width: 700px) {
        form {
            padding: 42px 56px 46px;
        }
    }

    @media (max-width: 480px) {
        body {
            padding: 32px 14px 44px;
        }

        h1 {
            font-size: 28px;
        }

        form {
            margin-top: 24px;
            padding: 25px 19px 28px;
            border-radius: 18px;
        }

        .timebox {
            width: 42% !important;
            max-width: 42%;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            transition: none !important;
        }
    }
</style>
